<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Q2 Drill 1</title>
    <link href= script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-image: url(Sc.png);
            background-repeat: no-repeat;
            background-size: cover;
            font-family: Arial;
            margin: 40px;
        }

        h1 {
            background-color: white;
            color: black;
            text-align: center;
            padding: 15px;
            border-radius: 50px;
            max-width: 800px;
            margin: 0 auto 50px auto;
        }

        .games {
            display: flex;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
        }

        .game {
            background-color: white;
            width: 30%;
            padding: 20px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .game-header {
            background-color: #fcd34d;
            color: black;
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container-fluid">

        <h1>Beginner's Guide to Soccer</h1>

        <div class="games row">

            <div class="game col-md-4">
                <div class="game-header">Basic Rules</div>
                <ul>
                    <li>No using hands</li>
                    <li>Offside rule</li>
                    <li>Fouls and penalties</li>
                    <li>Scoring goals</li>
                </ul>
            </div>

            <div class="game col-md-4">
                <div class="game-header">Soccer Equipment</div>
                <ul>
                    <li>Soccer ball</li>
                    <li>Cleats</li>
                    <li>Shin guards</li>
                    <li>Goal net</li>
                </ul>
            </div>

            <div class="game col-md-4">
                <div class="game-header">Basic Techniques</div>
                <ul>
                    <li>Passing and receiving</li>
                    <li>Dribbling skills</li>
                    <li>Shooting form</li>
                    <li>Positioning</li>
                </ul>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
